[tool.poetry]
name = "wordlift-sdk"
version = "8.4.6"
description = "Python toolkit for orchestrating WordLift imports and structured data workflows."
authors = ["David Riccitelli <david@wordlift.io>"]
readme = "README.md"
packages = [{ include = "wordlift_sdk" }]
include = [
    "wordlift_sdk/graphql/data/**",
    "docs/**",
    "CHANGELOG.md",
]

[tool.poetry.urls]
Documentation = "https://github.com/wordlift/python-sdk/blob/main/docs/INDEX.md"
Changelog = "https://github.com/wordlift/python-sdk/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.10, <3.15"
tenacity = "^9.0.0"
aiohttp = "^3.10.5"
wordlift-client = "^1.182.0"
certifi = "*"
gql = { extras = ["aiohttp"], version = "^3.5.2", optional = true }
# Google Colab requires pandas 2.1.4
pandas = { version = ">=2.1.4, <2.3.0", optional = true }
rdflib = { version = "^7.0.0", optional = true }
gspread = { version = "^6.1.2", optional = true }
google-auth = { version = "^2.35.0", optional = true }
tqdm = { version = "^4.67.1", optional = true }
advertools = { version = "^0.17.1", optional = true }
pycountry = { version = "^26.0.0", optional = true }
python-liquid = { version = "^2.0.1", optional = true }
jinja2 = { version = "^3.1.6", optional = true }
morph-kgc = { version = "^2.10.0", optional = true }
worph = { version = ">=0.1.11,<0.2.0", optional = true }
pyshacl = { version = "^0.31.0", optional = true }
pyoxigraph = { version = ">=0.3.22,<0.6.0", optional = true }
playwright = { version = "^1.52.0", optional = true }
trafilatura = { version = "^2.0.0", optional = true }
lxml = { version = "^5.4.0", optional = true }
requests = { version = "^2.32.3", optional = true }
twisted = { version = "^24.11.0", optional = true }
pydantic-core = { version = "^2.33.2", optional = true }
tomli = { version = "^2.2.1", python = "<3.11", optional = true }

[tool.poetry.extras]
core = []
google-sheets = ["google-auth", "gspread", "pandas"]
render = ["lxml", "playwright"]
validation = ["pyshacl", "rdflib", "requests", "tqdm"]
google-search-console = ["google-auth", "pandas", "pycountry", "tqdm", "twisted"]
ingestion = [
    "advertools",
    "google-auth",
    "gspread",
    "lxml",
    "morph-kgc",
    "worph",
    "pandas",
    "playwright",
    "pyshacl",
    "rdflib",
    "requests",
    "tqdm",
    "trafilatura",
]
structured-data = [
    "advertools",
    "lxml",
    "morph-kgc",
    "worph",
    "playwright",
    "pyshacl",
    "rdflib",
    "requests",
    "tqdm",
]
workflow = [
    "advertools",
    "gql",
    "google-auth",
    "gspread",
    "lxml",
    "pandas",
    "playwright",
    "pydantic-core",
    "python-liquid",
    "rdflib",
    "tqdm",
]
graph = [
    "pyoxigraph",
    "pyshacl",
    "python-liquid",
    "rdflib",
    "requests",
    "tomli",
    "tqdm",
]
kg-build = [
    "advertools",
    "gql",
    "google-auth",
    "gspread",
    "jinja2",
    "lxml",
    "morph-kgc",
    "worph",
    "pandas",
    "playwright",
    "pydantic-core",
    "pyshacl",
    "python-liquid",
    "rdflib",
    "requests",
    "tomli",
    "tqdm",
    "trafilatura",
]
legacy = [
    "gql",
    "google-auth",
    "gspread",
    "lxml",
    "pandas",
    "playwright",
    "pycountry",
    "pydantic-core",
    "python-liquid",
    "rdflib",
    "requests",
    "tqdm",
    "twisted",
]
all = [
    "advertools",
    "gql",
    "google-auth",
    "gspread",
    "jinja2",
    "lxml",
    "morph-kgc",
    "worph",
    "pandas",
    "playwright",
    "pycountry",
    "pydantic-core",
    "pyoxigraph",
    "pyshacl",
    "python-liquid",
    "rdflib",
    "requests",
    "tomli",
    "tqdm",
    "trafilatura",
    "twisted",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"
docker = "^7.1.0"
coverage = "^7.10.7"
ruff = "^0.15.0"
pre-commit = "^4.2.0"
pandas-stubs = "^2.3.3.251201"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# see https://github.com/pytest-dev/pytest-asyncio/issues/924#issuecomment-2321921915
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
