name: CI + Publish to PyPI (OIDC + Poetry)

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*" # e.g. 1.2.3
      - "v[0-9]*.[0-9]*.[0-9]*" # e.g. v1.2.3

permissions:
  id-token: write
  contents: read

jobs:
  slice-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        slice:
          - core
          - google-sheets
          - render
          - validation
          - google-search-console
          - ingestion
          - structured-data
          - workflow
          - graph
          - kg-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Install Poetry
        run: ~/.local/bin/pipx install poetry==2.2.1

      - name: Install ICU 74.2 development libraries
        if: matrix.slice == 'kg-build'
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config g++
          test "$(pkg-config --modversion icu-i18n)" = "74.2"

      - name: Install slice dependencies
        run: poetry install --no-interaction --extras "${{ matrix.slice }}"

      - name: Run slice smoke imports
        run: poetry run python tests/tools/run_slice_smoke_imports.py "${{ matrix.slice }}"

      - name: Run missing-extra hint checks
        if: matrix.slice == 'core'
        run: poetry run python tests/tools/check_missing_extra_hints.py

      - name: Run slice tests
        run: poetry run python tests/tools/run_slice_tests.py "${{ matrix.slice }}" -q

  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Install Poetry
        run: ~/.local/bin/pipx install poetry==2.2.1

      - name: Install ICU 74.2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config g++
          test "$(pkg-config --modversion icu-i18n)" = "74.2"

      - name: Install dependencies
        run: poetry install --no-interaction --extras "all"

      - name: Run tests with coverage
        run: poetry run coverage run -m pytest -q

      - name: Enforce coverage threshold
        run: poetry run coverage report --omit='tests/*' --fail-under=90

      - name: Search Gallery conformance diff
        run: poetry run python tests/tools/search_gallery_conformance_diff.py

  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [slice-tests, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Install Poetry 2.2.1
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          print-hash: true
