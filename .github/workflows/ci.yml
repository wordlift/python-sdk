name: Publish to PyPI (OIDC + Poetry)

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"     # e.g. 1.2.3
      - "v[0-9]*.[0-9]*.[0-9]*"    # e.g. v1.2.3

permissions:
  id-token: write       # REQUIRED for OIDC
  contents: read        # Needed to read repo contents

jobs:
  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- Official Poetry installation method (pipx) ---
      # Verified in your page context: https://python-poetry.org/docs/#installing-with-pipx
      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Install Poetry 2.2.1
        run: pipx install poetry==2.2.1

      # --- Install dependencies ---
      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      # --- Build the distribution ---
      - name: Build package
        run: poetry build

      # --- Publish to PyPI using Trusted Publishing (OIDC) ---
      # Verified official action: https://github.com/pypa/gh-action-pypi-publish
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          print-hash: true
