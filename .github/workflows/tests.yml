name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Install Poetry
        run: ~/.local/bin/pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: poetry run coverage run -m pytest -q

      - name: Enforce coverage threshold
        run: poetry run coverage report --omit='tests/*' --fail-under=90

      - name: Search Gallery conformance diff
        run: poetry run python tests/tools/search_gallery_conformance_diff.py
